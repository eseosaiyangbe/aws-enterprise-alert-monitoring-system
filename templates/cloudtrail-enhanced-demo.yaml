AWSTemplateFormatVersion: "2010-09-09"
Description: AWS CloudTrail Real-Time Monitoring and Alerting Demo

Parameters:
  AccountId:
    Type: String
    Description: AWS Account ID
  Region:
    Type: String
    Description: AWS Region
  EmailSubscription:
    Type: String
    Description: Email address for SNS notifications
    AllowedPattern: '^([\\w.%+-]+)@([\\w-]+\\.)+([a-zA-Z]{2,})$'
    ConstraintDescription: Must be a valid email address.

Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "cloudtrail-logs-demo-${AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref KMSKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
    DeletionPolicy: Retain

  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudTrailGetBucketAcl
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !Sub "arn:aws:s3:::cloudtrail-logs-demo-${AccountId}"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudtrail:${Region}:${AccountId}:trail/demo-cloudtrail"
          - Sid: AllowCloudTrailPutObject
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::cloudtrail-logs-demo-${AccountId}/AWSLogs/${AccountId}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudtrail:${Region}:${AccountId}:trail/demo-cloudtrail"
                s3:x-amz-acl: bucket-owner-full-control

  CloudTrail:
    Type: AWS::CloudTrail::Trail
    Properties:
      TrailName: demo-cloudtrail
      S3BucketName: !Ref S3Bucket
      IsLogging: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      KMSKeyId: !Ref KMSKey
      CloudWatchLogsLogGroupArn: !GetAtt CloudWatchLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt CloudWatchLogsRole.Arn

  CloudWatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "aws-cloudtrail-logs-${AccountId}-demo"
      RetentionInDays: 30

  CloudWatchLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudTrailLogsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: logs:CreateLogStream
                Resource: !Sub "arn:aws:logs:${Region}:${AccountId}:log-group:aws-cloudtrail-logs-${AccountId}-demo:*"
              - Effect: Allow
                Action: logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${Region}:${AccountId}:log-group:aws-cloudtrail-logs-${AccountId}-demo:*"

  KMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS Key for CloudTrail logs encryption
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRootAccess
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCloudTrailAccess
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:CreateGrant
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceArn: !Sub "arn:aws:cloudtrail:${Region}:${AccountId}:trail/demo-cloudtrail"

  SNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: cloudtrail-alerts-demo
      Subscription:
        - Endpoint: !Ref EmailSubscription
          Protocol: email

  LambdaSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref SNSTopic
      Protocol: lambda
      Endpoint: !GetAtt LambdaFunction.Arn

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref SNSTopic

  SNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref SNSTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref SNSTopic

  CloudTrailEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cloudtrail-unauthorized-operation
      Description: Routes UnauthorizedOperation API calls captured by CloudTrail to the alert topic.
      EventPattern:
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - UnauthorizedOperation
      State: ENABLED
      Targets:
        - Id: AlertTopic
          Arn: !Ref SNSTopic

  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: process-cloudtrail-logs
      Handler: index.lambda_handler
      Runtime: python3.12
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import os

          # Initialize AWS clients
          sns = boto3.client('sns')

          # Get environment variables
          SNS_TOPIC_ARN = os.environ['SNS_TOPIC_ARN']

          def lambda_handler(event, context):
              try:
                  # Iterate through SNS records (the SNS topic fans in EventBridge
                  # CloudTrail events and fans out the formatted alert)
                  for record in event['Records']:
                      log_data = json.loads(record['Sns']['Message'])

                      # EventBridge wraps the CloudTrail event under "detail";
                      # direct SNS messages carry the fields at the top level.
                      if isinstance(log_data, dict) and 'detail' in log_data:
                          log_data = log_data['detail']

                      # Extract key details from CloudTrail event
                      event_name = log_data.get('eventName', 'UnknownEvent')
                      user_identity = log_data.get('userIdentity', {})
                      source_ip = log_data.get('sourceIPAddress', 'UnknownIP')
                      timestamp = log_data.get('eventTime', 'UnknownTime')

                      # Print log for debugging
                      print(f"CloudTrail Event: {log_data}")

                      # Check for specific events (e.g., UnauthorizedOperation)
                      if event_name == "UnauthorizedOperation":
                          # Construct alert message
                          alert_message = (
                              f"ALERT: UnauthorizedOperation detected!\n\n"
                              f"User: {user_identity.get('arn', 'UnknownUser')}\n"
                              f"Source IP: {source_ip}\n"
                              f"Event Time: {timestamp}\n"
                              f"Event Details: {json.dumps(log_data, indent=4)}"
                          )
                          print(alert_message)

                          # Send notification via SNS
                          sns.publish(
                              TopicArn=SNS_TOPIC_ARN,
                              Message=alert_message,
                              Subject="CloudTrail UnauthorizedOperation Alert"
                          )

              except Exception as e:
                  print(f"Error processing event: {str(e)}")
                  raise
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref SNSTopic

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInlinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref SNSTopic
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${Region}:${AccountId}:log-group:/aws/lambda/process-cloudtrail-logs:*"

Outputs:
  CloudTrailName:
    Value: !Ref CloudTrail
    Description: Name of the CloudTrail trail.

  SNSTopicARN:
    Value: !Ref SNSTopic
    Description: ARN of the SNS topic.

  S3BucketName:
    Value: !Ref S3Bucket
    Description: Name of the S3 bucket used for CloudTrail logs.
